version: 2

models:
  - name: fct_matches
    description: One row per match, with result, goals and points worked out.
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']
      - name: home_points
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
      - name: away_points
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
  
  
  - name: fct_shots
    description: One row per shot, with xG, outcome and shot details.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: xg
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: team_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id                